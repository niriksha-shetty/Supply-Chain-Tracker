spring.application.name=api-gateway
server.port=8080
spring.main.allow-bean-definition-overriding=true

# Gateway Discovery Locator
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Routes
spring.cloud.gateway.routes[0].id=supplier-service
spring.cloud.gateway.routes[0].uri=lb://SUPPLIER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/suppliers/**

spring.cloud.gateway.routes[1].id=order-service
spring.cloud.gateway.routes[1].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.routes[2].id=disruption-service
spring.cloud.gateway.routes[2].uri=lb://DISRUPTION-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/disruptions/**

# Eureka Client Config
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/